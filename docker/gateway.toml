# OpenShell Gateway Configuration with OIDC/OAuth2 Authentication
#
# This configuration enables Claude Code to run in isolated Podman sandboxes
# with proper OAuth2/OIDC-based authentication instead of raw API tokens.
#
# Usage:
#   OPENSHELL_GATEWAY_CONFIG=openshell-claude-code-config/docker/gateway.toml \
#   OPENSHELL_DB_URL='sqlite:/var/lib/openshell/gateway.db?mode=rwc' \
#   openshell-gateway

[openshell]
version = 2

[openshell.gateway]
bind_address        = "127.0.0.1:8080"
health_bind_address = "127.0.0.1:8081"
log_level           = "info"
compute_driver      = "podman"
disable_tls         = true
name                = "openshell-claude-code"

# ============================================================================
# AUTHENTICATION CONFIGURATION
# ============================================================================
#
# Choose ONE of the following authentication methods:
#   1. OIDC (recommended for production) - Keycloak, Okta, Google, etc.
#   2. OAuth2 (GitHub, Google, Microsoft, etc.)
#   3. Unauthenticated (development only - NOT recommended for production)
#
# OIDC Configuration (Recommended)
# ============================================================================
#
# Uncomment and configure for OIDC-based authentication (e.g., Keycloak)
#
# [openshell.gateway.oidc]
# issuer_url = "http://keycloak:8080/realms/openshell"
# client_id = "openshell-gateway"
# client_secret = "your-client-secret-here"
# redirect_uri = "http://localhost:8080/oauth2/callback"
# scopes = ["openid", "profile", "email"]
# 
# # Optional: customize claim mappings
# # subject_claim = "sub"
# # name_claim = "name"
# # email_claim = "email"

# ============================================================================
# OAuth2 Configuration (Alternative)
# ============================================================================
#
# Uncomment and configure for OAuth2 with a specific provider
#
# [openshell.gateway.oauth2]
# provider = "google"  # or "github", "okta", "microsoft", etc.
# client_id = "your-client-id-here"
# client_secret = "your-client-secret-here"
# redirect_uri = "http://localhost:8080/oauth2/callback"

# ============================================================================
# Development Mode (Unauthenticated)
# ============================================================================
#
# WARNING: Only use for local development. Do NOT use in production.
# Unauthenticated users can create/manage any sandbox.
#
[openshell.gateway.auth]
allow_unauthenticated_users = true

# ============================================================================
# JWT Configuration (Supervisor Authentication)
# ============================================================================
#
# These keys are used for Gateway ↔ Supervisor authentication.
# Generated by: openshell-gateway generate-certs --output-dir /var/lib/openshell/tls
#
[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "openshell-claude-code"

# ============================================================================
# TLS Configuration
# ============================================================================
#
# For production, uncomment and configure TLS:
#
# [openshell.gateway.tls]
# cert_path = "/etc/openshell/tls/cert.pem"
# key_path = "/etc/openshell/tls/key.pem"

# ============================================================================
# PODMAN COMPUTE DRIVER
# ============================================================================
#
[openshell.drivers.podman]

# Default sandbox image
default_image = "nvcr.io/nvidia/base/ubuntu:24.04"

# Runtime images for sandbox and supervisor
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:latest"
supervisor_image = "ghcr.io/nvidia/openshell/supervisor:latest"

# Image pull strategy
image_pull_policy = "if_not_present"

# Sandbox label for identification
sandbox_label = "openshell"

# Timeout and health check settings
stop_timeout_secs = 10
health_check_interval_secs = 5

# ============================================================================
# LOGGING AND OBSERVABILITY
# ============================================================================
#
# Optional: Enable OpenTelemetry for observability
#
# [openshell.gateway.otlp]
# endpoint = "http://localhost:4317"
# protocol = "grpc"  # or "http"
